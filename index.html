<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ffdfeb">
<title>Hello Kitty World — Aventura Mágica</title>
<style>
:root{--pink:#ff5b91;--ink:#63364f;--cream:#fff8f2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffdbe8;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;touch-action:none}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#fff5fb,#ffd5e4 70%,#f7bfd9)}#game{position:relative;width:min(100vw,1280px);height:min(100dvh,800px);aspect-ratio:16/10;overflow:hidden;border:5px solid #fff9;border-radius:20px;box-shadow:0 12px 40px #9f477344;background:#9be7f0}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}#topbar{position:absolute;inset:10px 12px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;gap:8px}.pill{background:#fffaf0e8;border:2px solid #fff;border-radius:999px;padding:7px 12px;font-size:clamp(10px,2vw,15px);font-weight:900;box-shadow:0 3px 0 #d88ca1aa}.group{display:flex;gap:6px;flex-wrap:wrap}.hudbutton{pointer-events:auto;border:0;border-radius:999px;background:#fff8ef;color:#a5446a;padding:8px 11px;font-weight:900;font-size:12px;box-shadow:0 3px 0 #d889a4;cursor:pointer}.hudbutton:active{transform:translateY(2px);box-shadow:0 1px 0 #d889a4}#message{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:3;max-width:90%;text-align:center;background:#fffaf2ed;border:3px solid white;border-radius:20px;padding:12px 20px;font-weight:900;box-shadow:0 5px 0 #d587a0;pointer-events:none;opacity:0;transition:opacity .2s}#touch{position:absolute;inset:auto 0 10px;display:none;justify-content:space-between;align-items:end;padding:0 14px;z-index:4;pointer-events:none}.cluster{display:flex;gap:9px;pointer-events:auto}.touchbtn{width:clamp(48px,12vw,70px);height:clamp(48px,12vw,70px);border:3px solid #fff;background:#fff9;border-radius:22px;color:#a34267;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #d786a1aa;touch-action:none;user-select:none;-webkit-user-select:none}.touchbtn.action{background:#ff6e9a;color:white}.touchbtn:active,.touchbtn.on{transform:translateY(3px);box-shadow:0 2px 0 #d786a1aa}#overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#62385055;padding:14px}.card{width:min(590px,96%);max-height:92%;overflow:auto;background:linear-gradient(160deg,#fffaf4,#ffe5ef);border:4px solid white;border-radius:28px;padding:clamp(16px,4vw,30px);box-shadow:0 10px 0 #d184a0;text-align:center}.card h1{font-size:clamp(26px,6vw,48px);line-height:1;margin:0 0 7px;color:#ef5685;text-shadow:2px 2px #fff}.card h2{color:#e65283;margin:0 0 10px}.card p{margin:8px 0;line-height:1.45}.small{font-size:13px;opacity:.82}.startbtn{border:0;border-radius:999px;background:#f65388;color:white;font-weight:1000;font-size:18px;padding:13px 26px;box-shadow:0 5px 0 #bd3b6b;cursor:pointer;margin:8px}.startbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #bd3b6b}.selectrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.maplegend{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:12px}.hidden{display:none!important}@media(max-width:700px){#game{width:100vw;height:100dvh;aspect-ratio:auto;border:0;border-radius:0}.pill{padding:5px 8px}.hudbutton{padding:7px 8px;font-size:11px}#touch{display:flex}.card{max-height:85%}}@media(hover:none){#touch{display:flex}}
</style>
</head>
<body><main id="game"><canvas id="screen" width="320" height="200" aria-label="Jogo Hello Kitty World"></canvas><div id="topbar" class="hidden"><div class="group"><span class="pill" id="worldlabel">🌸 Mundo</span><span class="pill" id="stats">⭐ 0　🍓 0</span></div><div class="group"><button class="hudbutton" id="mapbtn">🗺️ Mapa</button><button class="hudbutton" id="pausebtn">Ⅱ</button></div></div><div id="message"></div><div id="touch"><div class="cluster"><button class="touchbtn" data-key="left">◀</button><button class="touchbtn" data-key="right">▶</button><button class="touchbtn" data-key="down">▼</button></div><div class="cluster"><button class="touchbtn action" data-key="shoot">★</button><button class="touchbtn action" data-key="run">✿</button><button class="touchbtn action" data-key="jump">↑</button></div></div><section id="overlay"></section></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),topbar=document.querySelector('#topbar'),touch=document.querySelector('#touch');
const W=320,H=200,T=16,keys={left:false,right:false,jump:false,run:false,shoot:false,down:false};
const worlds=[['🌷','Prado dos Sonhos','#91df9b','#54b876'],['🍬','Vila Doce','#ffb8d2','#ee7aa8'],['🌊','Lago das Pérolas','#81d9ec','#469bc4'],['🌳','Bosque Encantado','#91c986','#507d52'],['⛰️','Montanhas de Algodão','#b8a5e8','#7964b6'],['🎃','Mansão dos Laços','#8f80b5','#59476e'],['🏰','Castelo do Caos','#f3a18d','#b84e67'],['✨','Ilha Estrela Secreta','#f4c9fa','#aa70d2']];
const stageNames=['Trilha das Flores','Colinas de Morango','Passarela de Nuvens','Gruta dos Cristais','Jardim das Borboletas','Ponte do Piquenique','Caverna do Cupcake','Caminho do Arco-íris','Bosque das Cerejeiras','Lagoa da Lua','Torre das Estrelas','Castelo do Guardião'];
const saveKey='hk-world-save-v1';let save;try{save=JSON.parse(localStorage.getItem(saveKey))||{unlocked:0,cleared:[],stars:0,berries:0,diovana:false,character:'kitty',lives:5}}catch{save={unlocked:0,cleared:[],stars:0,berries:0,diovana:false,character:'kitty',lives:5}};
function persist(){localStorage.setItem(saveKey,JSON.stringify(save))}let mode='title',selected=0,world=0,stage=0,level,player,camera=0,frame=0,last=0,paused=false,noticeTimer=0,particles=[],shots=[],mapScroll=0,pipeCooldown=0,pipeLatch=false;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rand(n){return Math.random()*n}
function showMessage(s){const el=document.querySelector('#message');el.textContent=s;el.style.opacity=1;noticeTimer=110}
function setHUD(){document.querySelector('#worldlabel').textContent=worlds[world][0]+' '+worlds[world][1]+' · '+String(stage+1).padStart(2,'0');document.querySelector('#stats').textContent='⭐ '+save.stars+'　🍓 '+save.berries+'　♥ '+save.lives+(player?.power?'　✨ '+player.power:'')}
function title(){mode='title';topbar.classList.add('hidden');overlay.classList.remove('hidden');overlay.innerHTML=`<div class="card"><div style="font-size:55px;line-height:1">🎀 🐱 🎀</div><h1>Hello Kitty World</h1><h2>Aventura Mágica</h2><p>Uma jornada pixelada por oito reinos encantados! Reúna estrelas, encontre atalhos e enfrente guardiões para devolver a magia ao vale.</p><div class="maplegend"><span>← → mover</span><span>Espaço/↑ pular</span><span>Shift correr</span><span>↓ entrar em canos</span><span>Toque para jogar</span></div><button class="startbtn" id="play">${save.cleared.length?'Continuar aventura':'Começar aventura'} ✨</button><p class="small">Progresso salvo automaticamente neste aparelho.</p></div>`;document.querySelector('#play').onclick=()=>openMap()}
function openMap(){mode='map';paused=false;topbar.classList.add('hidden');overlay.classList.remove('hidden');renderMapCard()}
function renderMapCard(){const max=save.unlocked;let html=`<div class="card"><h2>🗺️ Mapa da Aventura</h2><p class="small">Escolha uma fase liberada. Cada reino tem 12 saídas, atalhos secretos e um guardião!</p><div class="maplegend">${worlds.map((w,i)=>`<button class="hudbutton" data-world="${i}" style="opacity:${i*12<=max?1:.48}">${w[0]} ${i<7?w[1].split(' ')[0]:'Especial'}</button>`).join('')}</div><div id="stagegrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0"></div><p class="small">${save.diovana?'🍊 Diovana Caroline desbloqueada!':'🔎 Dizem que existe uma trilha secreta para uma nova amiga...'}</p><div class="selectrow"><button class="startbtn" id="kitty">🐱 Hello Kitty</button>${save.diovana?'<button class="startbtn" id="dio">🍊 Diovana</button>':''}<button class="hudbutton" id="back">Voltar</button></div></div>`;overlay.innerHTML=html;let grid=document.querySelector('#stagegrid');worlds.forEach((w,i)=>{const b=document.querySelector(`[data-world="${i}"]`);b.onclick=()=>{if(i*12<=max){world=i;renderMapCard()}else showMessage('Complete o reino anterior para abrir este caminho!')}});for(let n=0;n<12;n++){const id=world*12+n,open=id<=max||save.cleared.includes(id),done=save.cleared.includes(id),b=document.createElement('button');b.className='hudbutton';b.style.cssText=`border-radius:16px;padding:10px 4px;${open?'':'opacity:.42'}`;b.innerHTML=`${done?'✅':open?'🌸':'🔒'}<br><small>${n+1}. ${stageNames[n].split(' ')[0]}</small>`;b.onclick=()=>{if(open)startLevel(world,n);else showMessage('Este caminho ainda está escondido!')};grid.appendChild(b)}document.querySelector('#kitty').onclick=()=>{save.character='kitty';persist()};if(document.querySelector('#dio'))document.querySelector('#dio').onclick=()=>{save.character='diovana';persist()};document.querySelector('#back').onclick=title}
function levelId(){return world*12+stage}
function startLevel(w,n){world=w;stage=n;mode='game';paused=false;overlay.classList.add('hidden');topbar.classList.remove('hidden');buildLevel();setHUD();last=performance.now()}
function buildLevel(){const seed=levelId();let rng=(()=>{let a=seed*98765+2345;return()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296}})();const length=150+stage*5+(world%3)*10;level={length,solids:[],items:[],enemies:[],platforms:[],goal:length-8,secret:false,boss:stage===11,theme:world,water:world===2,haunted:world===5,pipes:[]};
for(const px of [42,78,114])if(px<length-15)level.pipes.push({x:px*T,y:9*T,used:false});level.pipes.forEach((p,i)=>p.to=(i+1)%level.pipes.length);
for(let x=0;x<length;x++){level.solids.push({x,y:11,w:1,h:2,type:'ground'});if(x>8&&x<length-12&&rng()<.10){level.solids[level.solids.length-1].y=12;}
if(x>5&&x<length-10&&rng()<.10){let y=6+Math.floor(rng()*3),w=1+Math.floor(rng()*3);level.solids.push({x,y,w,h:1,type:rng()<.35?'question':'brick'})}
if(x>14&&x<length-12&&rng()<.04){level.platforms.push({x:x*T,y:(7+Math.floor(rng()*3))*T,w:2*T,base:(7+Math.floor(rng()*3))*T,phase:rng()*6.28})}
if(x>4&&x<length-8&&rng()<.14)level.items.push({x:x*T+8,y:(7+Math.floor(rng()*3))*T,kind:rng()<.17?'heart':rng()<.28?'star':'berry',got:false});
if(x>12&&x<length-15&&rng()<.055)level.enemies.push({x:x*T,y:10*T-12,home:x*T,dir:rng()<.5?-1:1,alive:true,type:rng()<.18?'fly':'puff',speed:.25+rng()*.25});}
// intentionally placed gaps and platform jumps
for(let k=0;k<5;k++){let gx=22+k*24+Math.floor(rng()*8);if(gx<length-12){level.gaps??=[];level.gaps.push({x:gx,w:2+(k%2)})}}
for(const g of level.gaps||[])for(const s of level.solids)if(s.type==='ground'&&s.x>=g.x&&s.x<g.x+g.w)s.type='removed';
for(let i=0;i<6;i++)level.items.push({x:(13+i*19)*T,y:(5+(i%3))*T,kind:i===4?'star':'berry',got:false});
if(level.boss){level.enemies.push({x:(length-20)*T,y:9*T,home:(length-20)*T,dir:-1,alive:true,type:'boss',speed:.35,hp:3})}
player={x:2*T,y:8*T,vx:0,vy:0,w:12,h:15,ground:false,facing:1,power:0,inv:0,anim:0,fireCD:0,checkpoint:2*T};camera=0;particles=[];shots=[];pipeCooldown=0;pipeLatch=false}
function finish(){const id=levelId();if(!save.cleared.includes(id))save.cleared.push(id);save.unlocked=Math.max(save.unlocked,Math.min(95,id+1));save.stars+=1;if(level.secret&&!save.diovana){save.diovana=true;showMessage('🌟 Segredo encontrado! Diovana Caroline se juntou à aventura!')}persist();setHUD();mode='complete';overlay.classList.remove('hidden');overlay.innerHTML=`<div class="card"><div style="font-size:45px">${level.boss?'🏆':'🌟'}</div><h2>${level.boss?'Guardião derrotado!':'Fase concluída!'}</h2><p>${stageNames[stage]} — ${worlds[world][1]}</p><p>⭐ +1 estrela &nbsp; 🍓 ${save.berries}</p><p class="small">${level.secret?'Você descobriu uma saída secreta!':'Há mais caminhos para explorar neste reino.'}</p><button class="startbtn" id="next">${stage<11?'Próxima fase':'Voltar ao mapa'} ➜</button></div>`;document.querySelector('#next').onclick=()=>stage<11?startLevel(world,stage+1):openMap()}
function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function text(s,x,y,size=8,color='#fff',align='left'){ctx.fillStyle=color;ctx.font=`bold ${size}px ui-rounded,system-ui,sans-serif`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function drawKitty(x,y,scale=1,cheer=false){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(scale,scale);const dio=save.character==='diovana';if(dio){ // curly hair silhouette and strawberry-colored outfit
circle(6,4,8,'#5a332b');circle(1,2,4,'#40241f');circle(11,1,4,'#40241f');circle(1,7,3,'#6a3b2b');circle(12,7,3,'#6a3b2b');box(0,0,13,10,'#4d2b24');circle(6,5,5,'#8a503e');box(2,13,9,7,'#f08349');box(1,14,11,4,'#ef5f73');circle(3,5,1,'#231d24');circle(9,5,1,'#231d24');box(5,7,2,1,'#f6b841');box(10,0,3,2,'#ffb0ca');box(-1,15,3,2,'#ffcf61');}
else{ // white kitty face, classic bow and whiskers
box(1,3,12,10,'#fffdf7');box(2,1,3,4,'#fffdf7');box(10,1,3,4,'#fffdf7');box(3,5,8,6,'#fffdf7');box(4,7,1,2,'#20202d');box(9,7,1,2,'#20202d');box(7,8,2,1,'#ffd34e');box(0,9,4,1,'#4c4350');box(-1,11,5,1,'#4c4350');box(10,9,4,1,'#4c4350');box(10,11,5,1,'#4c4350');box(0,2,3,3,'#ff4775');box(-1,3,2,2,'#ff4775');box(2,3,2,2,'#ff4775');circle(1,3,1,'#ff88a8');box(2,13,10,6,'#fffdf7');box(3,18,3,2,'#ff789d');box(9,18,3,2,'#ff789d');box(5,12,4,2,'#e94d78');}
if(cheer){box(2,0,2,3,'#ffc83f');box(11,-1,2,3,'#ffc83f')}ctx.restore()}
function sky(){let wc=worlds[world];box(0,0,W,H,wc[2]);for(let i=0;i<5;i++){let x=((i*83-camera*.18)%(W+50)+W+50)%(W+50)-20,y=17+(i*29)%44;circle(x,y,9,'#ffffffaa');circle(x+8,y+2,7,'#ffffffaa');circle(x-7,y+3,6,'#ffffffaa')}if(world===2){for(let i=0;i<8;i++){let x=(i*53-camera*.3)%W;circle(x,47+(i*37)%95,2,'#ffffff99')}}else{for(let i=0;i<5;i++){let x=(i*77-camera*.08)%W;circle(x,120+(i*11)%25,16,wc[3]+'77')}}}
function drawWorld(){sky(); // ground and distant decorations
for(const s of level.solids){if(s.type==='removed')continue;let x=s.x*T-camera;if(x<-20||x>W+20)continue;if(s.type==='ground'){box(x,11*T,T,2*T,worlds[world][3]);box(x,11*T,T,3,'#9bdf83');box(x+2,11*T+5,3,3,'#fff6b8');if(s.x%5===0){box(x+5,11*T-5,3,5,'#58b56c');circle(x+7,11*T-7,4,world===5?'#b49fd8':'#ffb1d0')}}else{box(x,s.y*T,s.w*T,8,s.type==='question'?'#ffcd68':'#c47b89');box(x+1,s.y*T+2,s.w*T-2,5,s.type==='question'?'#ffe89a':'#e9a1a7');if(s.type==='question')text('?',x+5,s.y*T+7,7,'#b36057');else{box(x+3,s.y*T+4,2,1,'#a3566b');box(x+10,s.y*T+4,2,1,'#a3566b')}}}
for(const p of level.platforms){let px=p.x-camera,py=p.base+Math.sin(frame*.05+p.phase)*10;if(px>-40&&px<W+20){box(px,py,p.w,6,'#f6a8cc');box(px+2,py+2,p.w-4,2,'#ffe7f1')}}
for(const p of level.pipes){let x=p.x-camera;if(x>-35&&x<W+20){box(x+2,p.y,2*T-4,2*T,'#58bd87');box(x,p.y,2*T,7,'#83e4a8');box(x+4,p.y+5,3,2*T-5,'#a5f2c1');text('✿',x+T,p.y+15,8,'#fff','center')}}
for(const it of level.items){if(it.got)continue;let x=it.x-camera,y=it.y+Math.sin(frame*.09+it.x)*2;if(x>-10&&x<W+10){if(it.kind==='berry'){circle(x,y,5,'#ed5c85');box(x-1,y-7,3,3,'#62b96c');circle(x-1,y,1,'#ffe8a6')}else if(it.kind==='star'){text('★',x,y+3,12,'#ffd451','center')}else{text('♥',x,y+3,11,'#ff759b','center')}}}
for(const e of level.enemies){if(!e.alive)continue;let x=e.x-camera;if(x<-20||x>W+20)continue;if(e.type==='boss'){circle(x+8,e.y+8,11,'#9e5270');circle(x+4,e.y+7,2,'#fff');circle(x+12,e.y+7,2,'#fff');box(x+4,e.y-2,3,4,'#ff6e9a');box(x+10,e.y-2,3,4,'#ff6e9a');text('♥'.repeat(Math.max(0,e.hp)),x+8,e.y-7,7,'#ffdf55','center')}else{circle(x+6,e.y+6,7,e.type==='fly'?'#b17add':'#e991b2');circle(x+4,e.y+5,1,'#433344');circle(x+9,e.y+5,1,'#433344');box(x+1,e.y+10,3,2,'#7c536e');box(x+9,e.y+10,3,2,'#7c536e');if(e.type==='fly'){box(x-1,e.y,4,3,'#fff9');box(x+10,e.y,4,3,'#fff9')}}}
// magic sparkle projectiles
for(const shot of shots)if(shot.x-camera>-10&&shot.x-camera<W+10)text('✦',shot.x-camera,shot.y+3,10,'#fff075','center');
// goal flag
let gx=level.goal*T-camera;box(gx,7*T,2,4*T,'#fff');box(gx+2,7*T,13,9,'#ff6291');text('✿',gx+8,7*T+7,6,'#fff','center');
if(player){if(player.inv%8<4){drawKitty(player.x-camera,player.y,1,player.ground&&Math.abs(player.vx)>1&&frame%25<8)}for(const p of particles){circle(p.x-camera,p.y,p.r,p.c)}}
// overlay terrain hint and level title
box(0,0,W,13,'#fff8');text(`${worlds[world][0]} ${worlds[world][1]}`,5,9,7,'#783c5a');text(`${stage+1}/12`,W-5,9,7,'#783c5a','right')}
function intersects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function getSolidRects(){const arr=[];for(const s of level.solids){if(s.type==='ground')arr.push({x:s.x*T,y:11*T,w:T,h:2*T});else if(s.type!=='removed')arr.push({x:s.x*T,y:s.y*T,w:s.w*T,h:8})}for(const p of level.platforms){let py=p.base+Math.sin(frame*.05+p.phase)*10;arr.push({x:p.x,y:py,w:p.w,h:6,oneway:true})}for(const p of level.pipes)if(!p.used)arr.push({x:p.x,y:p.y,w:2*T,h:2*T});return arr}
function takeHit(){if(player.inv>0)return;player.inv=100;player.vy=-3;player.vx=-player.facing*1.5;if(player.power>0){player.power--;showMessage('Seu poder protegeu você! 💖');setHUD();return}save.lives--;persist();setHUD();showMessage(save.lives>0?'Opa! Respire e tente de novo 💖':'Última chance!');if(save.lives<0){save.lives=5;persist();player.x=2*T;player.y=5*T}}
function enterPipe(){if(pipeCooldown>0||!keys.down||pipeLatch)return;pipeLatch=true;if(!player.ground)return;const i=level.pipes.findIndex(p=>player.x+player.w>p.x+3&&player.x<p.x+2*T-3&&Math.abs(player.y+player.h-p.y)<4);if(i<0)return;const source=level.pipes[i],dest=level.pipes[source.to];if(!dest)return;player.x=dest.x+(2*T-player.w)/2;player.y=dest.y-player.h;player.vx=0;player.vy=0;player.ground=true;camera=clamp(player.x-110,0,level.length*T-W);pipeCooldown=24;showMessage('Canos mágicos! Você chegou a outra trilha 🌿')}
function update(dt){frame++;if(mode!=='game'||paused)return;if(!keys.down)pipeLatch=false;if(pipeCooldown>0)pipeCooldown--;enterPipe();if(noticeTimer>0&&!--noticeTimer)document.querySelector('#message').style.opacity=0;player.anim++;if(player.fireCD>0)player.fireCD--;if(keys.shoot&&player.power>0&&player.fireCD===0){shots.push({x:player.x+player.facing*10,y:player.y+7,vx:player.facing*3.4,life:55});player.fireCD=22;keys.shoot=false}
const accel=keys.run?.32:.22,max=keys.run?2.45:1.55;if(keys.left){player.vx-=accel;player.facing=-1}else if(keys.right){player.vx+=accel;player.facing=1}else player.vx*=.78;player.vx=clamp(player.vx,-max,max);if(keys.jump&&(player.ground||world===2)){player.vy=world===2?-3.8:keys.run?-5.7:-4.65;player.ground=false;keys.jump=false}player.vy=Math.min(world===2?3.7:5.5,player.vy+(world===2?.12:.23));let oldY=player.y;player.x+=player.vx;for(const s of getSolidRects())if(!s.oneway&&intersects(player,s)){if(player.vx>0)player.x=s.x-player.w;else if(player.vx<0)player.x=s.x+s.w;player.vx=0}player.y+=player.vy;player.ground=false;
for(const s of getSolidRects()){if(intersects(player,s)){if(player.vy>=0&&oldY+player.h<=s.y+3){player.y=s.y-player.h;player.vy=0;player.ground=true}else if(player.vy<0&&!s.oneway){player.y=s.y+s.h;player.vy=0;if(s.y<11*T){const b=level.solids.find(q=>q.type!=='ground'&&q.x*T===s.x&&q.y*T===s.y);if(b?.type==='question'){b.type='used';level.items.push({x:b.x*T+8,y:b.y*T-8,kind:'heart',got:false})}else if(b?.type==='brick')b.type='used'}}}}
if(player.y>H+20){takeHit();player.x=Math.max(2*T,player.x-20);player.y=5*T;player.vy=0}player.x=clamp(player.x,0,(level.length-1)*T);if(player.inv>0)player.inv--;
for(const it of level.items){if(!it.got&&intersects(player,{x:it.x-4,y:it.y-5,w:9,h:11})){it.got=true;if(it.kind==='berry'){save.berries++;if(save.berries%30===0)save.lives++}else if(it.kind==='star')save.stars++;else player.power=Math.min(2,player.power+1);persist();setHUD();for(let i=0;i<5;i++)particles.push({x:it.x,y:it.y,vx:rand(2)-1,vy:-rand(2),r:2+rand(2),c:'#ffe37a',life:25})}}
for(const e of level.enemies){if(!e.alive)continue;e.x+=e.dir*e.speed;if(Math.abs(e.x-e.home)>38)e.dir*=-1;if(e.type==='boss')e.y=9*T+Math.sin(frame*.06)*6;if(intersects(player,{x:e.x,y:e.y,w:e.type==='boss'?20:13,h:e.type==='boss'?21:13})){if(player.vy>0&&oldY+player.h<e.y+7){if(e.type==='boss'){e.hp--;if(e.hp<=0)e.alive=false;player.vy=-4;showMessage('Pof! Mais uma vez!')}else e.alive=false;player.vy=-3.6;save.stars+=e.type==='boss'?1:0;setHUD()}else if(e.type==='boss'&&player.inv===0)takeHit();else if(player.inv===0)takeHit()}}
for(const shot of shots){shot.x+=shot.vx;shot.life--;for(const e of level.enemies){if(e.alive&&intersects({x:shot.x-4,y:shot.y-4,w:8,h:8},{x:e.x,y:e.y,w:e.type==='boss'?20:13,h:e.type==='boss'?21:13})){if(e.type==='boss'){e.hp--;if(e.hp<=0)e.alive=false}else e.alive=false;shot.life=0;for(let i=0;i<5;i++)particles.push({x:shot.x,y:shot.y,vx:rand(2)-1,vy:-rand(2),r:2,c:'#ffe78b',life:20})}}}shots=shots.filter(s=>s.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--}particles=particles.filter(p=>p.life>0);camera=clamp(player.x-110,0,level.length*T-W);
if(player.x>=level.goal*T){if(level.boss&&level.enemies.some(e=>e.type==='boss'&&e.alive)){player.x=level.goal*T-12;showMessage('O guardião ainda está protegendo a saída! 💫')}else{if(world===7&&stage===0)level.secret=true;finish()}}
// Hidden trail: jump above the canopy at a marked point in the first forest stage
if(world===3&&stage===4&&!level.secret&&player.x>70*T&&player.y<4*T){level.secret=true;save.diovana=true;persist();showMessage('Uma passagem secreta! Diovana Caroline desbloqueada 🍊')}
}
function pauseGame(){if(mode!=='game')return;paused=!paused;if(paused){overlay.classList.remove('hidden');overlay.innerHTML=`<div class="card"><div style="font-size:42px">☁️</div><h2>Pausa fofinha</h2><p>Respire fundo, aventureira!</p><button class="startbtn" id="resume">Continuar ▶</button><button class="hudbutton" id="pausemap">Voltar ao mapa</button></div>`;document.querySelector('#resume').onclick=()=>{paused=false;overlay.classList.add('hidden');last=performance.now()};document.querySelector('#pausemap').onclick=()=>openMap()}else overlay.classList.add('hidden')}
function loop(now){const dt=Math.min(2,(now-last)/16.67||1);last=now;if(mode==='game')update(dt);ctx.clearRect(0,0,W,H);if(mode==='game'||mode==='complete'){drawWorld()}else{sky();for(let i=0;i<8;i++){let x=25+i*40,y=130+Math.sin(frame*.035+i)*10;circle(x,y,6,'#ffe475');circle(x-5,y+4,3,'#ffb1d0')}drawKitty(145,102,2,true);text('A aventura começa!',W/2,155,11,'#ffffff','center');frame++}requestAnimationFrame(loop)}
function setKey(name,value){if(name==='jump'&&value&&!keys.jump)keys.jump=true;else if(name!=='jump')keys[name]=value}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','ShiftLeft','ShiftRight','KeyA','KeyD','KeyW','KeyX'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')setKey('left',true);if(e.code==='ArrowRight'||e.code==='KeyD')setKey('right',true);if(e.code==='ArrowDown')setKey('down',true);if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')setKey('jump',true);if(e.code==='ShiftLeft'||e.code==='ShiftRight')setKey('run',true);if(e.code==='KeyX')setKey('shoot',true);if(e.code==='Escape'||e.code==='KeyP'){if(mode==='game')pauseGame();else if(mode==='map')title()}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')setKey('left',false);if(e.code==='ArrowRight'||e.code==='KeyD')setKey('right',false);if(e.code==='ArrowDown')setKey('down',false);if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')keys.jump=false;if(e.code==='ShiftLeft'||e.code==='ShiftRight')setKey('run',false);if(e.code==='KeyX')setKey('shoot',false)});
document.querySelectorAll('.touchbtn').forEach(b=>{const key=b.dataset.key;const down=e=>{e.preventDefault();b.classList.add('on');setKey(key,true)};const up=e=>{e.preventDefault();b.classList.remove('on');if(key==='jump')keys.jump=false;else setKey(key,false)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
document.querySelector('#mapbtn').onclick=()=>openMap();document.querySelector('#pausebtn').onclick=()=>pauseGame();window.addEventListener('blur',()=>{keys.left=keys.right=keys.run=keys.jump=keys.down=keys.shoot=false;pipeLatch=false});title();requestAnimationFrame(loop);
})();
</script></body></html>
